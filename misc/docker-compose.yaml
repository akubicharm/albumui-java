version: '3.8'
services:
  apache:
    image: httpd:balancer 
    ports:
      - "8090:8090"
      - "8080:8080"
    networks:
      - mynet
  tomcat:
    image: tomcat
    ports:
      - "8081:8080"
    networks:
      - mynet
  tomcat2:
    image: tomcat
    ports:
      - "8082:8080"
    networks:
      - mynet      
networks:
  mynet:
